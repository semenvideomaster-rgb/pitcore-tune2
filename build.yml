name: Build VST3 (Windows)
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target PitCoreTune_VST3 --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: PitCoreTune-VST3
          path: build/PitCoreTune_artefacts/Release/VST3/
